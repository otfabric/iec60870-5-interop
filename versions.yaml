# Machine-readable version manifest for iec60870-5-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles and the adapters' go.mod / pom.xml are the source of truth
# for a build: scripts/check-versions.sh fails when this file disagrees.
#
# Implementations are named <standard>-<adapter>: one image each,
# ghcr.io/otfabric/iec60870-5-interop-<standard>-<adapter>.
#
# status: proposed     an adapter is planned or its source exists, never run here
#         experimental the image builds and parts of the self-tests ran
#         validated    smoke and the cross-stack run passed locally, results in
#                      docs/COMPATIBILITY.md (and reports/ when kept)

interop_version: "0.1.0"
contract_version: "2.0"        # docs/CONTAINER_CONTRACT.md
fixture_schema: "1.0"          # fixtures/schema/iec60870-5-fixture.schema.json

standards:
  iec101:
    name: "IEC 60870-5-101"
    transport: "FT 1.2 over one TCP connection (terminal-server style)"
    default_port: 2401
  iec102:
    name: "IEC 60870-5-102"
    transport: "FT 1.2 over one TCP connection (terminal-server style)"
    default_port: 2401
  iec103:
    name: "IEC 60870-5-103"
    transport: "FT 1.2 over one TCP connection (terminal-server style)"
    default_port: 2401
  iec104:
    name: "IEC 60870-5-104"
    transport: "TCP, APCI"
    default_port: 2404

implementations:
  # ---- IEC 60870-5-101 ----
  iec101-lib60870:
    standard: iec101
    status: validated
    upstream: "MZ Automation lib60870-C"
    repository: "https://github.com/mz-automation/lib60870"
    version: "v2.4.1"            # latest release
    revision: "7a388e3e133999e1ca77ba7521d55d074b7cd2bc"
    license: "GPL-3.0"
    language: "C"
    independent_engine: true
    roles: [server, client]
    link_modes: [unbalanced, balanced]
    note: >-
      CS101 master and slave on a pseudo terminal that the driver bridges to
      the TCP connection itself (adapters/iec101/lib60870/src/bridge.c).

  iec101-cbsigma:
    standard: iec101
    status: validated
    upstream: "cB-Sigma/iec60870"
    repository: "https://github.com/cB-Sigma/iec60870"
    module: "github.com/cB-Sigma/iec60870"
    version: "v0.3.0"            # latest release
    revision: "d0cad7ab6b8905d21dca12f4f7364e788c80ae17"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    link_modes: [unbalanced, balanced]
    note: >-
      Package cs101 on the TCP connection (io.ReadWriteCloser). Its IEC 101
      link was debugged against lib60870-C, so the pair is not two fully
      independent oracles; a third peer (digitalpetri) is planned. Balanced
      mode uses one link address in both directions: --remote-link-address
      must equal --link-address.

  iec101-digitalpetri:
    standard: iec101
    status: proposed
    upstream: "digitalpetri/iec60870"
    repository: "https://github.com/digitalpetri/iec60870"
    revision: "33e52b3"          # survey clone; full SHA to be pinned with the adapter
    license: "EPL-2.0"
    language: "Java"
    independent_engine: true
    note: "Native 101-over-TCP. No adapter yet (docs/ROADMAP.md)."

  # ---- IEC 60870-5-104 (carried over from otfabric/iec104-interop v0.6.0) ----
  iec104-lib60870:
    standard: iec104
    status: experimental
    upstream: "MZ Automation lib60870-C"
    repository: "https://github.com/mz-automation/lib60870"
    version: "v2.4.1"            # latest release
    revision: "7a388e3e133999e1ca77ba7521d55d074b7cd2bc"
    license: "GPL-3.0"
    language: "C"
    independent_engine: true
    roles: [server, client]

  iec104-openmuc:
    standard: iec104
    status: experimental
    upstream: "OpenMUC j60870"
    repository: "https://www.openmuc.org/iec-60870-5-104/"
    artifact: "org.openmuc:j60870"
    version: "1.8.0"
    license: "GPL-3.0"
    language: "Java"
    independent_engine: true
    roles: [server, client]
    note: >-
      Not built or run in this repository yet. j60870 1.8.0 cannot decode
      C_RD_NA_1 (tests/iec104/known-bugs.tsv).

  iec104-wendy512:
    standard: iec104
    status: experimental
    upstream: "wendy512/iec104"
    repository: "https://github.com/wendy512/iec104"
    module: "github.com/wendy512/iec104"
    version: "v1.0.4"            # latest release
    revision: "8fb65c83865c94cf37a89d12c9c42dd8c1807cc4"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    engine:
      upstream: "wendy512/go-iecp5"
      repository: "https://github.com/wendy512/go-iecp5"
      module: "github.com/wendy512/go-iecp5"
      version: "v1.2.6"          # latest release
      revision: "2269ee79a5e137847bbdc811be71a1064d303560"
      license: "LGPL-3.0"

  iec104-cbsigma:
    standard: iec104
    status: experimental
    upstream: "cB-Sigma/iec60870"
    repository: "https://github.com/cB-Sigma/iec60870"
    module: "github.com/cB-Sigma/iec60870"
    version: "v0.3.0"            # latest release
    revision: "d0cad7ab6b8905d21dca12f4f7364e788c80ae17"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]

  iec104-part5:
    standard: iec104
    status: experimental
    upstream: "pascaldekloe/part5"
    repository: "https://github.com/pascaldekloe/part5"
    module: "github.com/pascaldekloe/part5"
    version: "v0.3.0"            # latest release
    revision: "1aed6b914f5ce5fd070c0f37d57fc72fe7280a02"
    license: "CC0-1.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]

dependencies:
  gson: "2.14.0"               # iec104 openmuc adapter, Apache-2.0
  cjson: "debian trixie libcjson1"     # lib60870 adapters, MIT
  mbedtls: "3.6.7"             # lib60870 adapters, Apache-2.0 OR GPL-2.0-or-later
  mbedtls_sha256: "a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6"

base_images:
  # Digests recorded 2026-10-09 (iec104-interop); the Dockerfiles pin these by digest.
  debian_trixie_slim: "docker.io/library/debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f"
  maven_3_9_temurin_25: "docker.io/library/maven:3.9-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976"
  golang_1_27_2_trixie: "docker.io/library/golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d"
  temurin_25_jre_noble: "docker.io/library/eclipse-temurin:25-jre-noble@sha256:d9a39a23634650173f1e2bbc176227af9728587ecf0f4b62d53e9355cd7a19ab"

images:
  iec101-lib60870: "ghcr.io/otfabric/iec60870-5-interop-iec101-lib60870"
  iec101-cbsigma: "ghcr.io/otfabric/iec60870-5-interop-iec101-cbsigma"
  iec104-lib60870: "ghcr.io/otfabric/iec60870-5-interop-iec104-lib60870"
  iec104-openmuc: "ghcr.io/otfabric/iec60870-5-interop-iec104-openmuc"
  iec104-wendy512: "ghcr.io/otfabric/iec60870-5-interop-iec104-wendy512"
  iec104-cbsigma: "ghcr.io/otfabric/iec60870-5-interop-iec104-cbsigma"
  iec104-part5: "ghcr.io/otfabric/iec60870-5-interop-iec104-part5"

platforms:
  - "linux/amd64"
  - "linux/arm64"
