# Machine-readable version manifest for iec60870-5-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles and the adapters' go.mod / pom.xml are the source of truth
# for a build: scripts/check-versions.sh fails when this file disagrees.
#
# Implementations are named <standard>-<adapter>: one image each,
# ghcr.io/otfabric/iec60870-5-interop-<standard>-<adapter>.
#
# status: proposed     an adapter is planned or its source exists, never run here
#         experimental the image builds and parts of the self-tests ran
#         validated    smoke and the cross-stack run passed locally, results in
#                      docs/COMPATIBILITY.md (and reports/ when kept)

interop_version: "0.2.1"
contract_version: "2.1"        # docs/CONTAINER_CONTRACT.md
fixture_schema: "1.0"          # fixtures/schema/iec60870-5-fixture.schema.json, iec60870-5-103-fixture.schema.json

standards:
  iec101:
    name: "IEC 60870-5-101"
    transport: "FT 1.2 over one TCP connection (terminal-server style)"
    default_port: 2401
  iec102:
    name: "IEC 60870-5-102"
    transport: "FT 1.2 over one TCP connection (terminal-server style)"
    default_port: 2401
  iec103:
    name: "IEC 60870-5-103"
    transport: "FT 1.2 over one TCP connection (terminal-server style)"
    default_port: 2401
  iec104:
    name: "IEC 60870-5-104"
    transport: "TCP, APCI"
    default_port: 2404

implementations:
  # ---- IEC 60870-5-101 ----
  iec101-lib60870:
    standard: iec101
    status: validated
    upstream: "MZ Automation lib60870-C"
    repository: "https://github.com/mz-automation/lib60870"
    version: "v2.4.1"            # latest release
    revision: "7a388e3e133999e1ca77ba7521d55d074b7cd2bc"
    license: "GPL-3.0"
    language: "C"
    independent_engine: true
    roles: [server, client]
    link_modes: [unbalanced, balanced]
    note: >-
      CS101 master and slave on a pseudo terminal that the driver bridges to
      the TCP connection itself (adapters/iec101/lib60870/src/bridge.c).

  iec101-cbsigma:
    standard: iec101
    status: validated
    upstream: "cB-Sigma/iec60870"
    repository: "https://github.com/cB-Sigma/iec60870"
    module: "github.com/cB-Sigma/iec60870"
    version: "v0.3.0"            # latest release
    revision: "d0cad7ab6b8905d21dca12f4f7364e788c80ae17"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    link_modes: [unbalanced, balanced]
    note: >-
      Package cs101 on the TCP connection (io.ReadWriteCloser). Its IEC 101
      link was debugged against lib60870-C, so the pair is not two fully
      independent oracles; a third peer (digitalpetri) is planned. Balanced
      mode uses one link address in both directions: --remote-link-address
      must equal --link-address.

  iec101-digitalpetri:
    standard: iec101
    status: proposed
    upstream: "digitalpetri/iec60870"
    repository: "https://github.com/digitalpetri/iec60870"
    revision: "33e52b3"          # survey clone; full SHA to be pinned with the adapter
    license: "EPL-2.0"
    language: "Java"
    independent_engine: true
    note: "Native 101-over-TCP. No adapter yet (docs/ROADMAP.md)."

  # ---- IEC 60870-5-103 (contract 2.1) ----
  # Every reference server below deviates from IEC 60870-5-103 on the wire;
  # tests/iec103/known-bugs.tsv lists how. vitusdong is the only image with a
  # server, so the cross-stack run is every client against it.
  iec103-vitusdong:
    standard: iec103
    status: validated
    upstream: "vitusdong/iec103-dotnet"
    repository: "https://github.com/vitusdong/iec103-dotnet"
    version: "v0.1.0"            # latest release (tag of this commit)
    revision: "38aa54ce52b0451fd073d9865c5a5ea52f975018"
    license: "MIT"
    language: "C#"
    independent_engine: true
    roles: [server, client]
    link_modes: [unbalanced]
    note: >-
      .NET 8 master (Iec103Client) and slave (Iec103Server) on the TCP stream
      natively. Not independent of ARIEC103: its tests use a copy of the
      ArIEC103 slave simulator as the oracle. The server answers an
      interrogation with cause 11 and a 12-octet ASDU 1, confirms commands
      with cause 11, identifies without COL (tests/iec103/known-bugs.tsv),
      and sends measurands as single raw ASDU 9 only, so it is given none.

  iec103-goiecp5:
    standard: iec103
    status: validated
    upstream: "riclolsen/go-iecp5 (package cs103)"
    repository: "https://github.com/riclolsen/go-iecp5"
    module: "github.com/riclolsen/go-iecp5"
    version: "v0.4.7"            # latest release
    revision: "fbe6719d9acc9b5d90eed3b9468e7937b8ed4711"
    license: "LGPL-3.0 (LICENSE file); GPL-3.0 (README, cs103 file headers)"
    language: "Go"
    independent_engine: true
    roles: [client]
    link_modes: [unbalanced]
    note: >-
      Smoke and cross-stack passed (docs/COMPATIBILITY.md). The LICENSE file
      is LGPL-3.0, the README and the file headers of cs103 say GPL-3.0;
      either allows the GPL-3.0-or-later image, which the maintainer decided
      to publish (2026-11-11). A primary station only, with its own TCP
      transport; no SEND/NO REPLY (broadcast).

  iec103-ariec103:
    standard: iec103
    status: validated
    upstream: "masarray/ARIEC103"
    repository: "https://github.com/masarray/ARIEC103"
    version: "v1.2.31-3-gec08dd7"  # git describe of the pinned commit; Directory.Build.props says 1.3.0
    revision: "ec08dd73991be646864aef55e6a5538b78129db8"
    license: "Apache-2.0"
    language: "C#"
    independent_engine: true
    roles: [client]
    link_modes: [unbalanced]
    note: >-
      Iec103MasterSession on a TCP IByteTransport of the driver: its
      System.IO.Ports transport fails on a pseudo terminal (RtsEnable,
      "Inappropriate ioctl for device"). Its slave simulator has a model of
      its own and cannot serve a fixture, so the image is a client only.
      masarray/ARIEC60870 carries the same 103 code and is not a second peer.

  iec103-open103:
    standard: iec103
    status: validated
    upstream: "XVincentX/Open103"
    repository: "https://github.com/XVincentX/Open103"
    version: "887ff5a5"          # no releases; last commit 2022-12-12
    revision: "887ff5a5d909e9a23f94dafa2a5c4bdbb20f30ee"
    license: "Apache-2.0"
    language: "C++"
    independent_engine: true
    roles: [client]
    link_modes: [unbalanced]
    note: >-
      Header-only Windows C++ master, compiled for Linux unchanged with a shim
      of ours (adapters/iec103/open103/shim: OutputDebugStringA, localtime_s,
      the missing Logger::ToString, a TCP CommunicationPort) and driven through
      P/Invoke.

  # ---- IEC 60870-5-104 (carried over from otfabric/iec104-interop v0.6.0) ----
  iec104-lib60870:
    standard: iec104
    status: experimental
    upstream: "MZ Automation lib60870-C"
    repository: "https://github.com/mz-automation/lib60870"
    version: "v2.4.1"            # latest release
    revision: "7a388e3e133999e1ca77ba7521d55d074b7cd2bc"
    license: "GPL-3.0"
    language: "C"
    independent_engine: true
    roles: [server, client]

  iec104-openmuc:
    standard: iec104
    status: experimental
    upstream: "OpenMUC j60870"
    repository: "https://www.openmuc.org/iec-60870-5-104/"
    artifact: "org.openmuc:j60870"
    version: "1.8.0"
    license: "GPL-3.0"
    language: "Java"
    independent_engine: true
    roles: [server, client]
    note: >-
      Not built or run in this repository yet. j60870 1.8.0 cannot decode
      C_RD_NA_1 (tests/iec104/known-bugs.tsv).

  iec104-wendy512:
    standard: iec104
    status: experimental
    upstream: "wendy512/iec104"
    repository: "https://github.com/wendy512/iec104"
    module: "github.com/wendy512/iec104"
    version: "v1.0.4"            # latest release
    revision: "8fb65c83865c94cf37a89d12c9c42dd8c1807cc4"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    engine:
      upstream: "wendy512/go-iecp5"
      repository: "https://github.com/wendy512/go-iecp5"
      module: "github.com/wendy512/go-iecp5"
      version: "v1.2.6"          # latest release
      revision: "2269ee79a5e137847bbdc811be71a1064d303560"
      license: "LGPL-3.0"

  iec104-cbsigma:
    standard: iec104
    status: experimental
    upstream: "cB-Sigma/iec60870"
    repository: "https://github.com/cB-Sigma/iec60870"
    module: "github.com/cB-Sigma/iec60870"
    version: "v0.3.0"            # latest release
    revision: "d0cad7ab6b8905d21dca12f4f7364e788c80ae17"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]

  iec104-part5:
    standard: iec104
    status: experimental
    upstream: "pascaldekloe/part5"
    repository: "https://github.com/pascaldekloe/part5"
    module: "github.com/pascaldekloe/part5"
    version: "v0.3.0"            # latest release
    revision: "1aed6b914f5ce5fd070c0f37d57fc72fe7280a02"
    license: "CC0-1.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]

dependencies:
  nuget_system_io_ports: "8.0.0"   # iec103 vitusdong and ariec103, MIT; packages.lock.json pins the content hash
  nuget_system_text_encoding_codepages: "8.0.0"   # iec103 vitusdong, MIT
  go_bug_st_serial: "v1.6.4"   # iec103 goiecp5 (through cs101), BSD-3-Clause
  gson: "2.14.0"               # iec104 openmuc adapter, Apache-2.0
  cjson: "debian trixie libcjson1"     # lib60870 adapters, MIT
  mbedtls: "3.6.7"             # lib60870 adapters, Apache-2.0 OR GPL-2.0-or-later
  mbedtls_sha256: "a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6"

base_images:
  # .NET 8 images of the IEC 103 adapters (mcr.microsoft.com), recorded 2026-11-11.
  dotnet_sdk_8_bookworm_slim: "mcr.microsoft.com/dotnet/sdk:8.0-bookworm-slim@sha256:1b955f179b02df4f0eb5fadedaa898cbe44d620a64aab52eec72c8e91d1355b5"
  dotnet_runtime_8_bookworm_slim: "mcr.microsoft.com/dotnet/runtime:8.0-bookworm-slim@sha256:21b0f8ba67bef2f121781d17a8e21956aeaa2d8da8e4b5db0da1ea8f91e2b6a1"
  # Digests recorded 2026-10-09 (iec104-interop); the Dockerfiles pin these by digest.
  debian_trixie_slim: "docker.io/library/debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f"
  maven_3_9_temurin_25: "docker.io/library/maven:3.9-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976"
  golang_1_27_2_trixie: "docker.io/library/golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d"
  temurin_25_jre_noble: "docker.io/library/eclipse-temurin:25-jre-noble@sha256:d9a39a23634650173f1e2bbc176227af9728587ecf0f4b62d53e9355cd7a19ab"

images:
  iec101-lib60870: "ghcr.io/otfabric/iec60870-5-interop-iec101-lib60870"
  iec101-cbsigma: "ghcr.io/otfabric/iec60870-5-interop-iec101-cbsigma"
  iec103-vitusdong: "ghcr.io/otfabric/iec60870-5-interop-iec103-vitusdong"
  iec103-goiecp5: "ghcr.io/otfabric/iec60870-5-interop-iec103-goiecp5"    # not published (licence)
  iec103-ariec103: "ghcr.io/otfabric/iec60870-5-interop-iec103-ariec103"
  iec103-open103: "ghcr.io/otfabric/iec60870-5-interop-iec103-open103"
  iec104-lib60870: "ghcr.io/otfabric/iec60870-5-interop-iec104-lib60870"
  iec104-openmuc: "ghcr.io/otfabric/iec60870-5-interop-iec104-openmuc"
  iec104-wendy512: "ghcr.io/otfabric/iec60870-5-interop-iec104-wendy512"
  iec104-cbsigma: "ghcr.io/otfabric/iec60870-5-interop-iec104-cbsigma"
  iec104-part5: "ghcr.io/otfabric/iec60870-5-interop-iec104-part5"

platforms:
  - "linux/amd64"
  - "linux/arm64"
