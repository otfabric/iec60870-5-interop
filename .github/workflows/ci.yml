# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  schedule:
    # Nightly: catches drift in what the pinned builds fetch.
    - cron: "17 3 * * *"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Nothing is pulled from Docker Hub: anonymous pulls are rate limited per
  # runner address and its token service times out under load. Base images
  # (pinned by digest) and build tooling come from Google's mirror of it, and
  # every registry operation is retried on transient failures (scripts/retry.sh).
  BASE_REGISTRY: mirror.gcr.io/library
  TOOLS_REGISTRY: mirror.gcr.io

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Fixtures, versions, scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Unit tests of the result scripts
        run: python3 -m unittest discover -q -s scripts -p 'test_*.py'
      - name: versions.yaml matches the build files
        run: scripts/check-versions.sh
      - name: RELEASE.md has the notes of interop_version
        run: scripts/release-notes.sh > /dev/null
      - name: Fixtures
        run: python3 scripts/validate-fixtures.py --require-schema
      - name: Shellcheck
        run: make lint
      - name: No reference to a library under test
        # AGENTS.md hard rule 1: adapters, fixtures, scripts, schemas and tests
        # must not know any consumer (go-iec60870-5, go-iec104). Documentation
        # may name consumers as examples. own/ (ADR-0012) is the one exception.
        run: |
          if grep -rInE 'go-iec60870|go-iec104|otfabric/go-' adapters fixtures schemas scripts tests Makefile compose.yaml; then
            echo "::error::consumer-specific reference found"; exit 1
          fi

  # The own-stack adapters (ADR-0012, own/go-iec60870-5/README.md): only that
  # they compile and pass their unit tests on the go.mod starting point. The
  # images are built, tested and published by hand (own-go-iec60870-5.yml).
  own:
    name: Own stack module (vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: own/go-iec60870-5/go.mod
          cache-dependency-path: own/go-iec60870-5/go.sum
      - name: gofmt, go vet, go test
        working-directory: own/go-iec60870-5
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

  # Built and self-tested natively on both architectures: no emulation.
  selftest:
    name: Build, smoke, cross-stack (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: Build images
        run: make images

      - name: Capabilities
        run: make capabilities | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Images are linux/${{ matrix.arch }}
        run: |
          for image in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'iec60870-5-interop-.*:dev$'); do
            got=$(docker image inspect --format '{{.Architecture}}' "${image}")
            [[ "${got}" == "${{ matrix.arch }}" ]] || { echo "::error::${image} is ${got}"; exit 1; }
          done

      - name: Smoke, cross-stack self-test, document schemas
        run: make documents

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p reports/logs
          for c in $(docker ps -aq --filter "label=iec60870-5-interop.run"); do
            docker logs "$c" > "reports/logs/${c}.log" 2>&1 || true
          done

      - name: Upload documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-documents-${{ matrix.arch }}
          path: reports/
          if-no-files-found: ignore
