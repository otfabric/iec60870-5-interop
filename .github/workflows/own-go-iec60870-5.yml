name: Own stack (go-iec60870-5)
run-name: "Build iec60870-5-interop-<standard>-otfabric from the latest go-iec60870-5, by @${{ github.actor }} on ${{ github.ref_name }}"

# Manual only. Builds ghcr.io/otfabric/iec60870-5-interop-<standard>-otfabric
# (iec101, iec102, iec103, iec104) from the latest go-iec60870-5 release, tests
# each with the self-tests and references of the latest harness release and,
# when run from main, publishes them as :<go-iec60870-5 version> and :latest.
#
# Nothing is committed, and nothing else waits for this: no pin to bump, no
# release, no schedule. So no release loop can form (own/go-iec60870-5/README.md).
# The harness Release workflow and manifest.json do not contain these images.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: own-go-iec60870-5
  cancel-in-progress: false

env:
  BASE_REGISTRY: mirror.gcr.io/library
  TOOLS_REGISTRY: mirror.gcr.io

jobs:
  version:
    name: Resolve versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream: ${{ steps.version.outputs.upstream }}
      revision: ${{ steps.version.outputs.revision }}
      harness: ${{ steps.version.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: The latest go-iec60870-5, and the harness release to test against
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          repo=https://github.com/otfabric/go-iec60870-5.git
          upstream=$(git ls-remote --tags --refs "${repo}" 'v[0-9]*' \
            | sed 's,.*refs/tags/,,' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "${upstream}" ] || { echo "::error::no go-iec60870-5 release found"; exit 1; }
          # An annotated tag has a peeled line, with the commit.
          revision=$(git ls-remote --tags "${repo}" "refs/tags/${upstream}^{}" | cut -f1)
          [ -n "${revision}" ] || revision=$(git ls-remote --tags "${repo}" "refs/tags/${upstream}" | cut -f1)
          harness=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [ -n "${harness}" ] || { echo "::error::no harness release found"; exit 1; }
          if [ "${REF}" = "main" ]; then publish="yes: :${upstream} and :latest of each image"; else publish="no: not run from main"; fi
          {
            echo "upstream=${upstream}"
            echo "revision=${revision}"
            echo "harness=${harness}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Versions"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| go-iec60870-5 (latest release) | \`${upstream}\` |"
            echo "| go-iec60870-5 commit | \`${revision}\` |"
            echo "| Image tag | \`${upstream}\` |"
            echo "| Reference images (latest harness release) | \`${harness}\` |"
            echo "| This repository | \`${REF}\` at \`${SHA}\` |"
            echo "| Publish | ${publish} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.standard }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        standard: [iec101, iec102, iec103, iec104]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - standard: iec101
            port: 2401
            references: lib60870 cbsigma digitalpetri
          - standard: iec102
            port: 2401
            references: gisce
          - standard: iec103
            port: 2401
            references: vitusdong goiecp5 ariec103 open103
          - standard: iec104
            port: 2404
            references: lib60870 openmuc wendy512 cbsigma part5
    env:
      VERSION: ${{ needs.version.outputs.harness }}
      UPSTREAM: ${{ needs.version.outputs.upstream }}
      REVISION: ${{ needs.version.outputs.revision }}
      STANDARD: ${{ matrix.standard }}
      REFERENCES: ${{ matrix.references }}
      IMAGE: ghcr.io/otfabric/iec60870-5-interop-${{ matrix.standard }}-otfabric
      OWN: ghcr.io/otfabric/iec60870-5-interop-${{ matrix.standard }}-otfabric:ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: Build from go-iec60870-5 ${{ needs.version.outputs.upstream }}
        run: |
          scripts/retry.sh docker build --progress=plain --build-arg BASE_REGISTRY="${BASE_REGISTRY}" \
            --build-arg STANDARD="${STANDARD}" --build-arg PORT="${{ matrix.port }}" \
            --build-arg UPSTREAM_VERSION="${UPSTREAM}" --build-arg UPSTREAM_SHA="${REVISION}" \
            --build-arg ADAPTER_VERSION="${UPSTREAM}" \
            --tag "${OWN}" --file own/go-iec60870-5/Dockerfile .

      - name: What was built
        run: |
          reported=$(docker run --rm "${OWN}" print-capabilities | jq -r '.upstream.version')
          {
            echo "## ${STANDARD} ${{ matrix.arch }}"
            echo
            echo "- \`$(docker run --rm "${OWN}" version)\`"
            docker run --rm "${OWN}" print-capabilities | jq -r '"- upstream \(.upstream.name) \(.upstream.version), commit `\(.upstream.revision)`, independent engine: \(.upstream.independentEngine)"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${reported}" = "${UPSTREAM}" ] || { echo "::error::the image reports go-iec60870-5 ${reported}, want ${UPSTREAM}"; exit 1; }

      # The self-tests are those of the harness release whose reference images
      # they run against: main's scripts may already check what only the next
      # release's references do.
      - name: Check out the self-tests of ${{ needs.version.outputs.harness }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.harness }}
          path: harness

      - name: Pull the reference images of ${{ needs.version.outputs.harness }}
        run: |
          for a in ${REFERENCES}; do
            scripts/retry.sh docker pull --quiet "ghcr.io/otfabric/iec60870-5-interop-${STANDARD}-${a}:${VERSION}"
            docker run --rm "ghcr.io/otfabric/iec60870-5-interop-${STANDARD}-${a}:${VERSION}" print-capabilities \
              | jq -r --arg image "${STANDARD}-${a}:${VERSION}" '"- \($image): \(.upstream.name) \(.upstream.version)"' | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Smoke, cross-stack self-test against the references, document schemas
        working-directory: harness
        env:
          TAG: ci
        run: |
          set -o pipefail
          mkdir -p reports
          # The Makefile points ADAPTER_IMAGE_<standard>_otfabric at :$TAG, the image built above.
          REPORT_DIR=reports make -f own/go-iec60870-5/Makefile smoke interop STANDARD="${STANDARD}" REFERENCES_${STANDARD}="${REFERENCES}" 2>&1 | tee reports/interop.log
          python3 scripts/validate-documents.py reports
          grep -E '^\[(smoke|interop)[^]]*\]' reports/interop.log | tail -n 40 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: own-go-iec60870-5-${{ matrix.standard }}-documents-${{ matrix.arch }}
          path: |
            harness/reports/
            reports/
          if-no-files-found: ignore

      - name: Push the tested image as <version>-<arch>
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          docker tag "${OWN}" "${IMAGE}:${UPSTREAM}-${ARCH}"
          scripts/retry.sh docker push --quiet "${IMAGE}:${UPSTREAM}-${ARCH}"

  publish:
    name: Publish ${{ matrix.standard }} ${{ needs.version.outputs.upstream }} and latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        standard: [iec101, iec102, iec103, iec104]
    env:
      UPSTREAM: ${{ needs.version.outputs.upstream }}
      IMAGE: ghcr.io/otfabric/iec60870-5-interop-${{ matrix.standard }}-otfabric
    steps:
      - uses: actions/checkout@v7
      - name: Join the architectures
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          scripts/retry.sh docker buildx imagetools create --tag "${IMAGE}:${UPSTREAM}" --tag "${IMAGE}:latest" \
            "${IMAGE}:${UPSTREAM}-amd64" "${IMAGE}:${UPSTREAM}-arm64"
          digest=$(scripts/retry.sh docker buildx imagetools inspect "${IMAGE}:${UPSTREAM}" --format '{{.Manifest.Digest}}')
          {
            echo "## Published"
            echo
            echo "- \`${IMAGE}:${UPSTREAM}\`"
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}@${digest}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
